name: Update theme gallery

# Whenever a theme is added or changed, rebuild the showcase in README.md and themes/README.md.
on:
  push:
    branches: [main]
    paths: ['themes/**', 'scripts/build-gallery.js', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/validate-themes.js
      - run: node scripts/build-gallery.js
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "Gallery already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md themes
          git commit -m "Update theme gallery"
          git push
