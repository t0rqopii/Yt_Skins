name: Bug report
description: Something on YouTube looks broken or the studio misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a screenshot if you can.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the studio\n2. Turn on Glass surfaces\n3. ..."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "4.2.0"
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 131 / Edge / Brave"
    validations: { required: true }
